# Windows, macOS and Linux builds on every push and on demand. The packages show up as
# artifacts on the run's page; pushing a tag like v0.1.0 also attaches them to a release.
#
#   Windows x64 / ARM64: portable .zip + installer (-setup.exe), both with ffmpeg
#   Linux x64 / ARM64:   .zip (with ffmpeg and install.sh) + .deb
#   macOS (Apple silicon and Intel in one app): .dmg + .zip
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      # The tests run on x64; the ARM64 build is made on x64 and can't run here.
      - if: matrix.arch == 'x64'
        run: cargo test --release
      - name: Inno Setup (for the installer)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build the zip and the installer
        shell: pwsh
        run: ./packaging/build-windows.ps1 -Arch ${{ matrix.arch }}
      # The tests don't open a window. Checks the title, as the "couldn't open" box also keeps it running.
      - name: Check the window opens
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $p = Start-Process target/x86_64-pc-windows-msvc/release/TelescopeView.exe -ArgumentList docs/images/banner.png -PassThru
          Start-Sleep 15
          $p.Refresh()
          "window title: '$($p.MainWindowTitle)'"
          if ($p.MainWindowTitle -notlike 'banner.png*') { throw "the window didn't open" }
          $p | Stop-Process
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            target/windows/*.zip
            target/windows/*-setup.exe

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-unknown-linux-gnu
          # Built on x64 through `cross` (Docker), see Cross.toml.
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    # rust-toolchain.toml pins the Windows (MSVC) toolchain; Linux and macOS use plain stable.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libasound2-dev zip
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cross
      - if: matrix.arch == 'x64'
        run: cargo test --release
      - run: sh packaging/build-linux.sh
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE_FFMPEG: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/linux/*.zip
            target/linux/*.deb

  macos:
    runs-on: macos-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo test --release
      - run: sh packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/macos/*.dmg
            target/macos/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A SHA-256 checksum for every download, so it can be verified.
      - run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
