name: Feature or format request
description: An idea for TelescopeView, or a file format it should open.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: Describe the feature or format, and what you'd use it for.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: Another app you use for it, or the workaround you have now.
