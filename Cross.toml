# `cross` builds the Linux ARM64 version on an x64 machine (packaging/build-linux.sh with
# TARGET=aarch64-unknown-linux-gnu). The sound library's headers have to be there for ARM64.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes pkg-config libasound2-dev:$CROSS_DEB_ARCH",
]
